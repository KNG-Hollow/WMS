services:
  backend:
    user: "1000"
    container_name: wms-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "1323:1323"
    networks:
      - web-network
    volumes:
      - ./backend/public:/app/public:ro
      - ./.env:/app/.env:ro
      - ${JWT_KEY}:/app/jwt.pem:ro
      - ${JWT_PUB_KEY}:/app/jwt-pub.pem:ro
      - ${TLS_CERTIFICATE}:/app/cert.pem:ro
      - ${TLS_KEY}:/app/key.pem:ro
    environment:
      DBUSER: ${DBUSER}
      DBPASS: ${DBPASS}
      DBHOST: ${DBHOST}
      DBPORT: ${DBPORT}
      DBNAME: ${DBNAME}
      JWTKEY: ${JWTKEY}
      JWTPUBKEY: ${JWTPUBKEY}
      TLSCRT: ${TLSCRT}
      TLSKEY: ${TLSKEY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    develop:
      watch:
        - path: ./backend
          action: rebuild
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:1323/health"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 30s

  frontend:
    user: "1000"
    container_name: wms-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app:cached
      - ./.env:/app/.env:ro
      - ${TLS_CERTIFICATE}:/cert.pem:ro
      - ${TLS_KEY}:/key.pem:ro
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - web-network
    environment:
      VITE_API_URL: ${VITE_API_URL}

  nginx:
    image: nginx:alpine
    container_name: wms-nginx
    volumes:
      - ${TLS_CERTIFICATE}:/etc/nginx/cert.pem:ro
      - ${TLS_KEY}:/etc/nginx/key.pem:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build/client:/etc/nginx/html
    depends_on:
      - backend
      #- frontend
    ports:
      - "81:80"
      - "444:443"
    networks:
      - web-network

  redis:
    image: redis:latest
    container_name: wms-redis
    ports:
      - "6379:6379"
      #- "6300:6379"
    networks:
      - web-network
    restart: unless-stopped

networks:
  web-network:
    driver: bridge
